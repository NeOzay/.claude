# Semence du fichier de suivi d'implementation-tracker.
#
# Le suivi est posé à l'Étape 2 du tracker, une fois le plan validé, maintenu pendant
# l'implémentation, archivé en `done/` à la clôture. Ce qui est mécaniquement connu à la
# création est prérempli ; le reste porte son marqueur, et chaque description dit d'où vient
# la valeur. La skill n'en décrit pas la structure : elle renvoie ici.

name = "suivi"
description = "Fichier de suivi d'une implémentation conduite par implementation-tracker : objectif, étapes, état, décisions."

[fields.slug]
type = "slug"
required = true
description = "Le slug du brief, repris exactement — jamais réinventé."

[fields.titre]
type = "text"
required = true
description = "Le titre du chantier, repris du brief."

[fields.branche]
type = "slug"
required = true
description = "La branche d'implémentation : exactement le slug."

[fields.base]
type = "text"
required = true
description = "La branche principale d'où part le chantier, cible de l'aplatissement à la clôture."

[fields.statut]
type = "enum"
required = true
description = "En cours, bloqué sur une étape, terminé à la clôture, ou abandonné."
values = ["en-cours", "bloqué", "terminé", "abandonné"]
text = "en-cours"

[fields.session]
type = "int"
required = true
description = "Incrémenté à chaque reprise, pas à chaque étape."
text = "1"

[fields.lettre]
type = "text"
required = true
description = "La lettre des tags d'étape (<L>E0, <L>E1…), rendue par `commit-chantier lettre` à la création."

[fields.execution]
type = "enum"
required = true
description = """
Repris tel quel du brief :
- `délégué` : les étapes substantielles partent à step-implementer ;
- `direct` : elles se font dans la session."""
values = ["délégué", "direct"]

[fields.plan]
type = "text"
required = true
description = "Le chemin du plan, tel que le harness l'a nommé à l'entrée en plan mode."

[fields.brief]
type = "text"
description = "Le chemin du brief. Absent quand le chantier a été ouvert sans cadrage."

[fields.audit]
type = "text"
description = "Le chemin du rapport d'audit, posé au premier audit du chantier."

[fields.road-map]
type = "slug"
description = "L'id de l'entrée de road-map dont le chantier part, s'il en part une."

[fields."créé"]
type = "date"
required = true
description = "La date de création du suivi."
command = "date +%F"

[fields.maj]
type = "date"
required = true
description = "La date de la dernière écriture dans le suivi, actualisée à chaque écriture."
command = "date +%F"

[sections."Objectif et périmètre"]
required = true
description = """
Repris du brief, pas reformulé, en cinq blocs :
- `**Symptôme** :`
- `**But** :`
- `**Critères de réussite** :`
- `**Hors-périmètre** :`
- `**Signaux de dérive** :`

Sans symptôme, la section a perdu le lien avec l'intention d'origine : c'est lui qui montre
qu'on a construit la bonne solution au mauvais problème.
Un élargissement accepté s'y ajoute, daté."""

[sections."Étapes"]
required = true
description = """
Les étapes du plan, une par ligne :
  - [état] N. Intitulé — <fichiers> — vérif: <commande>

État :
- `[ ]` à faire ;
- `[>]` en cours ;
- `[x]` fait ;
- `[!]` bloqué, suivi de la raison.

Le suivi porte l'intitulé et l'état, le plan porte le contenu."""

[sections."État courant"]
required = true
description = """
Écrit pour une reprise à froid, en quatre lignes :
- `**Prochaine action** :` lisible sans relire le plan ;
- `**Vérification** :` la commande d'ensemble, distincte de celles des étapes ;
- `**Dernier audit** :` `<sha> — <VERDICT> — <date>`, ou `aucun` ;
- `**Notes** :`

Un verdict sans SHA ne se rattache à rien : le code a bougé depuis. Le raisonnement de l'audit
vit dans son rapport, pas ici."""

[sections."Journal de décisions"]
description = """
Ce qui contraint la suite — choix d'architecture, trade-offs, dépendances, verdict d'audit
défavorable —, jamais les micro-choix. Une entrée de deux à trois lignes :
  - **<date>** — décision. *Pourquoi* : … *Rejeté* : …"""
