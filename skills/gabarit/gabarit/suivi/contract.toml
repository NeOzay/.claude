# Semence du fichier de suivi d'implementation-tracker.
#
# Le suivi est posé à la Phase 2 du tracker, une fois le plan validé, maintenu pendant
# l'implémentation, archivé en `done/` à la clôture. Ce qui est mécaniquement connu à la
# création est prérempli ; le reste porte son marqueur, et chaque description dit d'où vient
# la valeur. La skill n'en décrit pas la structure : elle renvoie ici.

name = "suivi"
description = "Fichier de suivi d'une implémentation conduite par implementation-tracker : objectif, étapes, état, décisions."

[fields.slug]
type = "slug"
required = true
description = "Le slug du brief, repris exactement — jamais réinventé."

[fields.titre]
type = "text"
required = true
description = "Le titre du chantier, repris du brief."

[fields.branche]
type = "slug"
required = true
description = "La branche d'implémentation : exactement le slug."

[fields.base]
type = "text"
required = true
description = "La branche principale d'où part le chantier, cible de l'aplatissement à la clôture."

[fields.statut]
type = "enum"
required = true
description = "En cours, bloqué sur une étape, terminé à la clôture, ou abandonné."
values = ["en-cours", "bloqué", "terminé", "abandonné"]
text = "en-cours"

[fields.session]
type = "int"
required = true
description = "Incrémenté à chaque reprise, pas à chaque étape."
text = "1"

[fields.lettre]
type = "text"
required = true
description = "La lettre des tags d'étape (<L>E0, <L>E1…), rendue par `commit-chantier lettre` à la création."

[fields."modèle"]
type = "enum"
required = true
description = "Le modèle qui conduit toute l'implémentation, repris de la section `## Modèle` du Plan."
values = ["sonnet", "opus"]

[fields.plan]
type = "text"
required = true
description = "Le chemin du plan, tel que le harness l'a nommé à l'entrée en plan mode."

[fields.brief]
type = "text"
description = "Le chemin du brief. Absent quand le chantier a été ouvert sans cadrage."

[fields.audit]
type = "text"
description = """
Le chemin du répertoire des rapports d'audit, `.claude/implementation/<slug>.audit`, posé au
premier audit du chantier."""

[fields.road-map]
type = "slug"
description = "L'id de l'entrée de road-map dont le chantier part, s'il en part une."

[fields.skills]
type = "list"
required = true
description = """
Les noms des Shadow-skills utiles au Chantier, retenus pendant le plan par `shadow-skill cherche` ;
`[]` si aucun. À la reprise, `shadow-skill depuis-suivi <slug>` les remet au contexte."""

[fields."créé"]
type = "date"
required = true
description = "La date de création du suivi."
command = "date +%F"

[fields.maj]
type = "date"
required = true
description = "La date de la dernière écriture dans le suivi, actualisée à chaque écriture."
command = "date +%F"

[sections."Objectif et périmètre"]
required = true
description = """
Repris du brief, pas reformulé. Sans symptôme, la section a perdu le lien avec l'intention
d'origine : c'est lui qui montre qu'on a construit la bonne solution au mauvais problème."""
type = "label"
forme = "bold"

[sections."Objectif et périmètre".labels."Symptôme"]
required = true
order = 1
description = "Le symptôme du brief."

[sections."Objectif et périmètre".labels.But]
required = true
order = 2
description = "Le but du brief."

[sections."Objectif et périmètre".labels."Critères de réussite"]
required = true
order = 3
description = "Les critères de réussite du brief, leurs numéros compris."
type = "motif"
motif = "**C{n: int}** — {critere}"
fin = "\n"

[sections."Objectif et périmètre".labels."Critères de réussite".captures.n]
description = "Le numéro du critère au brief."
min = 1
sequence = true

[sections."Objectif et périmètre".labels."Hors-périmètre"]
required = true
order = 4
description = "Les exclusions du brief."
type = "motif"
motif = "{exclusion}"
fin = "\n"

[sections."Objectif et périmètre".labels."Signaux de dérive"]
required = true
order = 5
description = "Les signaux de dérive du brief, leurs numéros et leurs sources compris."
type = "motif"
motif = "**S{n: int}** — {signal}"
fin = "\n"

[sections."Objectif et périmètre".labels."Signaux de dérive".captures.n]
description = "Le numéro du signal au brief."
min = 1
sequence = true

[sections."Objectif et périmètre".labels."Élargissements"]
order = 6
description = """
Un élargissement du périmètre accepté par l'utilisateur, une puce par élargissement, avec son
entrée au journal. Le brief, figé, ne change pas."""
type = "motif"
motif = "{date: date} — {elargissement}"
fin = "\n"

[sections."Objectif et périmètre".labels."Élargissements".captures.date]
description = "La date de l'accord de l'utilisateur."

[sections."Étapes"]
required = true
description = """
Les étapes du plan, une puce par étape. Le suivi porte l'intitulé et l'état, le plan porte le
contenu. La dernière étape, sans fichier, écrit `aucun fichier`."""
type = "motif"
motif = "[{etat: enum}] {n: int}. {intitule} — {fichiers} — vérif: {verif}"
fin = "\n"

[sections."Étapes".captures.etat]
description = """
Une espace : à faire ; `>` en cours ; `x` fait ; `!` bloqué, la raison écrite en `**Notes**` de
l'état courant."""
values = [" ", ">", "x", "!"]

[sections."Étapes".captures.n]
description = "Le numéro de l'étape, cité par les commits et les tags."
min = 1
sequence = true

[sections."Étapes".captures.fichiers]
description = "Les fichiers que l'étape touche, ou `aucun fichier`."

[sections."Étapes".captures.verif]
description = "La commande qui vérifie l'étape, entre accents graves ; à défaut, ce qu'elle rejoue."

[sections."État courant"]
required = true
description = """
Écrit pour une reprise à froid. Le raisonnement de l'audit vit dans son rapport, pas ici."""
type = "label"
forme = "bold"

[sections."État courant".labels."Prochaine action"]
required = true
order = 1
description = "La prochaine action, lisible sans relire le plan."

[sections."État courant".labels."Vérification"]
required = true
order = 2
description = "La commande d'ensemble, distincte de celles des étapes."

[sections."État courant".labels."Dernier audit"]
required = true
order = 3
description = """
`<sha> — <VERDICT> — <date>`, ou `aucun`. Un verdict sans SHA ne se rattache à rien : le code a
bougé depuis."""

[sections."État courant".labels.Notes]
order = 4
description = "Ce que la reprise doit savoir de plus, dont la raison d'une étape `[!]`."

[sections."Passation"]
description = """
Ce que la session qui s'arrête transmet à la suivante à la Passation, et qu'aucun autre fichier
ne dit. Réécrite à chaque Passation, jamais complétée. Quand elle est à jour, c'est la reprise
d'implementation-tracker qui le juge, et elle seule. Tant qu'aucune Passation n'a eu lieu, elle
reste au squelette."""
type = "label"
forme = "bold"

[sections."Passation".labels."Écrite"]
required = true
order = 1
description = """
`session <N>, après <tag>` — la session qui l'écrit et le dernier tag posé, d'Étape ou de
Retouche : ce qui dit de quand elle date."""

[sections."Passation".labels."En cours"]
required = true
order = 2
description = "Le travail entamé, dans son état exact, ou « rien »."

[sections."Passation".labels."À savoir"]
required = true
order = 3
description = "Ce que la session a appris, absent du Suivi, du Plan et du code."

[sections."Dettes écartées"]
description = """
Les dettes d'audit que l'utilisateur écarte, une puce par dette. L'orchestrateur l'écrit sur accord
de l'utilisateur, jamais l'auditeur ; l'audit suivant range chaque dette écrite ici en Dette
écartée, par `audit range`, qui en lit justificatif et date."""
type = "motif"
motif = "R{n: int} — {justificatif} — {date: date}"
fin = "\n"

[sections."Dettes écartées".captures.n]
description = "Le numéro de la dette au rapport d'audit."
min = 1

[sections."Dettes écartées".captures.justificatif]
description = """
Pourquoi l'utilisateur l'écarte. Sans « — » entouré d'espaces : la capture s'arrête au premier,
et la date ne se lirait plus."""

[sections."Dettes écartées".captures.date]
description = "La date de l'accord de l'utilisateur."

[sections."Journal de décisions"]
description = """
Ce qui contraint la suite — choix d'architecture, trade-offs, dépendances, verdict d'audit
défavorable —, jamais les micro-choix. Une entrée de deux à trois lignes, la décision suivie de
*Pourquoi* : … *Rejeté* : …"""
type = "motif"
motif = "**{date: date}** — {decision}"
fin = "\n"
