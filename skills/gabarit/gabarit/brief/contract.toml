# Semence du brief d'intention d'intent-brief.
#
# Le brief est posé en brouillon à la Phase 3 d'intent-brief, après les échanges, corrigé par
# l'utilisateur, puis figé à la validation. Chaque description dit ce que le champ ou la section
# porte, et d'où vient la valeur : la skill n'en décrit pas la structure, elle renvoie ici.

name = "brief"
description = """
Brief d'intention d'un chantier, cadré par intent-brief avant le plan : intention, critères,
bornes, contraintes. Une page au plus — au-delà, c'est un plan déguisé."""

[fields.slug]
type = "slug"
required = true
description = """
Kebab-case, court. Choisi à l'écriture du brief, il se renomme jusqu'à la validation — le fichier
et ce champ ensemble —, puis ne change plus : le suivi, l'audit et le plan archivé le reprennent
exactement."""

[fields.titre]
type = "text"
required = true
description = "Le chantier en une ligne, dans les mots de l'utilisateur."

[fields.statut]
type = "enum"
required = true
description = """
- `brouillon` : de l'écriture à la validation, l'utilisateur le corrige et le brief sert de
  registre ;
- `validé` : l'utilisateur a validé, le brief est figé et la suite s'écrit dans le suivi."""
values = ["brouillon", "validé"]
text = "brouillon"

[fields."créé"]
type = "date"
required = true
description = "La date de création du brief."
command = "date +%F"

[sections.Intention]
required = true
description = """
Le symptôme et le but. Si l'un ne répond pas à l'autre, c'est le premier désalignement : le dire
avant d'écrire."""
type = "label"
forme = "bold"

[sections.Intention.labels."Symptôme"]
required = true
order = 1
description = """
Ce qui est vécu, dans les mots de l'utilisateur. C'est ce qui permet, trois sessions plus tard, de
voir qu'on a construit la bonne solution au mauvais problème."""

[sections.Intention.labels.But]
required = true
order = 2
description = "Ce qu'on veut obtenir, en une ou deux phrases."

[sections."Critères de réussite"]
required = true
description = """
Une puce par critère, observable et vérifiable. Une commande plutôt qu'une phrase : une commande se
rejoue."""
type = "motif"
motif = "**C{n: int}** — {critere}"
fin = "\n"

[sections."Critères de réussite".captures.n]
description = "Le numéro du critère : le plan, sa relecture et l'audit citent C3, pas la phrase."
min = 1
sequence = true

[sections."Hors-périmètre"]
required = true
description = """
Une puce par exclusion explicite : ce qu'on ne fait PAS dans ce chantier.
Personne ne le formule spontanément : il se demande."""
type = "motif"
motif = "{exclusion}"
fin = "\n"

[sections."Signaux de dérive"]
required = true
description = """
Une puce par signal : à quoi on reconnaît, en lisant le diff, qu'on part dans la mauvaise
direction. Repris dans le suivi comme déclencheur d'arrêt. Chaque signal porte sa source, comme une
contrainte.

Axe non posé : `non abordé` à la place du signal, et y revenir — c'est le seul contenu du brief qui
reste actif pendant l'implémentation."""
type = "motif"
motif = "**S{n: int}** — {signal}"
fin = "\n"

[sections."Signaux de dérive".captures.n]
description = "Le numéro du signal, cité par le suivi et l'audit."
min = 1
sequence = true

[sections."Contraintes connues de l'utilisateur"]
required = true
description = """
Une puce par contrainte que le dépôt ne dit pas — rien de ce que le code montre déjà.

Natures usuelles : **Historique**, **Intouchable**, **Réutiliser**, **Rejeté d'emblée**,
**Existant**, **Décision**.

Chaque contrainte porte sa source, à sa fin :
- `(dit)` : dite par l'utilisateur ;
- `(dépôt: <chemin ou sha>)` : vérifiée dans le dépôt.

Une puce sans source est une supposition, à retirer."""
type = "motif"
motif = "**{nature}** : {contrainte}"
fin = "\n"

[sections."Incertitudes à lever en plan"]
required = true
description = """
Le registre des ambiguïtés. Chacune y entre à l'écriture du brief, ou dès qu'elle apparaît
ensuite, dans sa formulation d'origine, et en sort :
- levée : la réponse part dans la section concernée ;
- tranchée : la décision est écrite, en **Décision** des contraintes ;
- reportée : elle reste ici, mission explicite du plan.

Aucune : `— aucune`."""
