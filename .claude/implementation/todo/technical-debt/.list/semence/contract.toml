name = "technical-debt"
description = "Dette technique constatée et non résolue"

[origin]
def = "technical-debt"
version = 3

[fields.id]
type = "slug"
description = ""

[fields.title]
type = "text"
required = true
description = "l'énoncé de la dette, tel qu'il figurait en titre d'entrée"

[fields.date]
type = "date"
required = true
description = "date du constat, jamais modifiée"

[fields.severite]
type = "enum"
required = true
description = "gravité, selon l'échelle du registre ; « inconnue » tant que personne ne l'a jugée"
# L'ORDRE DE CETTE LISTE EST CELUI DE LA GRAVITÉ, de la moindre à la pire :
# `list --sort=-severite` range ainsi le plus grave en tête. `inconnue` vient en premier
# pour finir en dernier : jamais jugée, elle ne passe devant aucune dette jugée.
values = ["inconnue", "note", "avertissement", "majeur", "critique"]

[fields.chantier]
type = "text"
required = true
description = "slug du Chantier qui l'a identifiée, sans préfixe daté, ou « Hors chantier »"

[fields.reference]
type = "text"
required = true
description = "où le Chantier l'a écrite : le R<n> du rapport, ou le lieu cité ; « Non précisée » à défaut"

# FAUX PAR DÉFAUT : une dette neuve n'est pas épinglée. Épingler sert à la retrouver
# (`list --where pin=true`), et à rien d'autre — `debt-review` l'ignore.
[fields.pin]
type = "bool"
required = true
text = "false"
description = "épinglée pour être retrouvée sans effort ; sans autre effet"

[fields.source]
type = "text"
required = false
deprecated = "Remplacé par chantier et reference ; ne plus l'écrire."
description = "le chantier qui l'a identifiée et où il l'a écrit, verbatim"

[fields.reviewed]
type = "date"
required = false
description = "date de la dernière revue qui a statué sur cette entrée"

[fields.category]
type = "enum"
required = false
description = "verdict de la dernière revue, posé par debt-review"
values = ["a-solder", "non-pertinent", "doublon", "pas-une-dette", "aggravee", "pertinent", "inverifiable"]

[sections."Constat"]
required = true
description = "ce qui a été observé, factuel et daté, sans remède ni numéro de ligne"

[sections."Pourquoi c'est gênant"]
required = true
description = "le coût réel si rien n'est fait, et le mode de défaillance qu'il ouvre"

[sections."Pour solder"]
required = true
description = "ce qu'il faut faire pour que la dette disparaisse — sans lui, c'est un regret"

[sections."Assumé"]
required = false
description = "pourquoi le report a été délibéré, quand il l'a été"
