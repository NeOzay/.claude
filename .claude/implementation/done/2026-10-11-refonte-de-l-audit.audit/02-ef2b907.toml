[[dette.precedente]]
id = "R1"
nature = "qualité"
emplacement = "skills/implementation-tracker/scripts/tests/test_dettes.py:13, test_pose.py:14, conftest.py:21"
constat = "Les deux suites neuves importent `from conftest import SLUG`. Le module `conftest` qu'elles trouvent dépend de l'ordre de collecte : lancée après une autre suite, la commande qui rassemble tous les tests du dépôt échoue. La **Vérification** de `## État courant` du Suivi, telle qu'écrite, sort en erreur sur le HEAD audité : `~/.claude/.venv/bin/python -m pytest skills/implementation-tracker/scripts/tests/ scripts/tests/ skills/git-smart-commit/scripts/tests/ -q` → `ImportError: cannot import name 'SLUG' from 'conftest' (/home/debian/.claude/scripts/tests/conftest.py)` sur test_dettes.py et test_pose.py, « 2 errors in 0.51s ». Sur un arbre extrait de `master`, la même commande rend « 214 passed ». Aucune vérification d'Étape ne le voyait, car chacune lance un seul répertoire. Le dépôt documente ce piège et l'évite dans deux modules voisins, scripts/tests/depot_jouet.py:3-9 et skills/list-dir/scripts/tests/jouet.py:8-13 : « conftest.py ne garde que les fixtures, qui ne s'importent jamais ». skills/shadow-skill/scripts/tests/ y tombait déjà, et le Chantier en ajoute une instance."
trouvee = "01-d0cf0ec"
solution = "Sortir `SLUG`, et ce que les tests importent de conftest, dans un module au nom unique, par exemple `scripts/tests/chantier_jouet.py`, sur le modèle de `depot_jouet.py`. `conftest.py` ne garde alors que la fixture `chantier`. Vérifier en lançant la commande de `## État courant` dans ses deux ordres."
