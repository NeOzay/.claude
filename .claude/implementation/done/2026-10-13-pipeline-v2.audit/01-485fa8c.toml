nature = "alignement"
emplacement = "Brief, C8 ; .claude/implementation/todo/technical-debt/session-dump-ecart-ambigu-dans-skill-md.md"
constat = "uvx rumdl fmt --check . sort en 1 : un paragraphe de ce fichier de todo/technical-debt/ est à re-césurer. Le défaut est antérieur au Chantier : il se reproduit sur l'arbre de master extrait. Le journal du Suivi (2026-10-13) le classe hors périmètre, mais n'amende pas C8, qui exige que la commande passe. C8 est donc non atteint, et le format des vérifications des Étapes 1 à 5 et 7 échoue avec lui."
