severite = "bloquant"

[[dette.actuelle]]
id = "R2"
nature = "qualité"
emplacement = "pipeline-v2/README.md:102-113 (« Typage »)"
constat = "La recette de typage du README limite le tsconfig temporaire à include = [TY, $M/hooks]. Elle laisse dehors le contrat de types du mod, types/index.d.ts, que plugin.json déclare. Sur proto-etat, tsc sort donc en 2 : TS2345, « 'pv2-etat' is not assignable to type 'never' » sur $.state.get(COMPTEUR) et $.state.get(HORODATAGE) (register.tsx:165-166), que TY soit le fichier de plugin-authoring ou celui de session. Le code est juste : tsc -p sur le tsconfig que le moteur pose (include ../../types) sort en 0. C'est le contrôle de C8 et des Étapes 3 à 5 qui ment : il rejette un prototype correct, et l'Étape 3 n'a pu le passer tel qu'écrit. La recette d'OUTILLAGE.md, antérieure au Chantier, a le même angle mort."
trouvee = "01-485fa8c"
solution = "Ajouter « $M/types » à l'include du tsconfig temporaire dans pipeline-v2/README.md, puis relancer la recette sur les quatre prototypes ; tsc doit sortir en 0 sur proto-etat. Le même manque dans OUTILLAGE.md relève du registre de dette, hors de ce Chantier."
severite = "bloquant"

[[dette.actuelle]]
id = "R3"
nature = "alignement"
emplacement = "environnement de la session du Chantier ; pipeline-v2/README.md:24-37 (« Une session témoin »)"
constat = "La session du Chantier (claude -c, PID 77068) porte CLAUDE_CODE_PLUGIN_DIRS=~/.claude/pipeline-v2/proto-veille dans son environnement. La variable ne vient ni du profil du shell ni de l'environnement initial du processus : elle a été prise dans settings.json au démarrage, pendant l'observation. Son retrait du fichier ne l'a pas ôtée de la session. Conséquence : tout claude lancé depuis cette session charge pv2-veille. Le premier claude -p de l'audit l'a fait : journal debug/eeec1364-….txt, « Loaded inline plugin from path: pv2-veille », trois $.process.run bash, journal.log réécrit. La session du Chantier elle-même l'a sans doute chargé, contre la décision du Plan (« La session du Chantier ne charge aucun prototype ») et contre le journal du Suivi (« posé le temps d'une observation puis retiré »). Le README dit de retirer la variable, mais pas de redémarrer les sessions ouvertes pendant qu'elle y était."
trouvee = "01-485fa8c"
solution = "Redémarrer la session du Chantier, ou unset CLAUDE_CODE_PLUGIN_DIRS, avant les commandes de Clôture qui lancent claude. Ajouter au README, « Une session témoin », qu'une session démarrée pendant que la variable était posée la garde jusqu'à sa fin, et la passe à tout claude qu'elle lance. Verser ce constat à claude-code-mods, avec sa version."
severite = "avertissement"

