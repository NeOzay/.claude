emplacement = "pipeline-v2/api/inventaire.py:128, 137"
constat = "Un fichier de types ou un inventaire --compare introuvable fait lever FileNotFoundError avec sa trace. Ce n'est pas l'échec nommé (Echec, sortie 2) que le module promet pour un en-tête manquant. La règle Python du dépôt veut qu'une valeur lue de l'extérieur rende un échec nommé. L'échec reste bruyant, pas silencieux : aucun coût démontré."
trouvee = "01-485fa8c"
solution = "Vérifier l'existence des deux chemins dans main() et rendre un Echec nommé (« types introuvables : <chemin> »), sortie 2, comme pour les autres échecs de lecture."
