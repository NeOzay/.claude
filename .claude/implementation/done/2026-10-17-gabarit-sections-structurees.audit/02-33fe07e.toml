[[dette.actuelle]]
id = "R6"
nature = "qualité"
emplacement = "skills/gabarit/scripts/gabarit/structure.py:317-334 (`_squelette_au_marqueur`, le `continue` de la ligne 330-331) ; skills/list-dir/scripts/listdir/store.py:799"
constat = "Un label prérempli par `text` ou `command` est sauté sans que son corps soit lu. Le correctif de R2 tient donc pour intacte une table facultative dont la seule chose écrite est la valeur réécrite d'un label prérempli. Deux effets silencieux en découlent. `merge` omet la section entière, et la valeur écrite disparaît de l'aggloméré sans rien signaler. `--filled` ne réclame pas non plus les labels requis de cette table. Rejoué sur une List-dir : table `Annexe` facultative, labels `Source` requis, `Note`, et `Outil` (`text = \"pytest\"`). Dans un Élément, `Outil` est réécrit « nox, choisi après comparaison » et les autres labels restent au Marqueur. `list-dir validate --filled` → conforme, code 0 ; `list-dir merge` → l'aggloméré ne contient ni `### Annexe` ni « nox ». La règle est voulue (Journal, 2026-10-17 ; format.md:300-301) : elle écarte la comparaison au squelette parce qu'une `command` varie. Un `text`, lui, est littéral et se compare sans risque, et c'est le cas que la règle laisse perdre. Le cas est rare : il faut une table facultative dont on ne touche qu'un label prérempli. Mais la perte ne se voit pas."
trouvee = "02-33fe07e"
solution = "Compter comme entamé un label `text` dont le corps rogné diffère de son `text` : la comparaison est sûre, puisque le `text` est littéral. Garder le saut pour une `command` seule, et nommer cette limite dans format.md, « Une table facultative laissée au squelette ». Ajouter à test_squelette.py et à test_structure.py le cas d'un `text` réécrit, ni omis par `merge` ni épargné par `--filled`."
severite = "avertissement"

