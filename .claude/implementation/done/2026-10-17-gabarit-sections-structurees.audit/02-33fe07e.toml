signal = "Une capture vérifiée hors `check_value`, ou un motif accepté en regex : une seconde définition d'un type, ou une seconde syntaxe."
etat = "absent"
constat = "Chaque capture passe par `check_value` (structure.py:243). `ENTIER` (types.py:210) ne sert qu'à convertir avant ce jugement : un `int` mal écrit part en chaîne, et `check_value` le refuse (structure.py:200-213, Plan Q3). `min`, `max` et `sequence` sont des contraintes en plus, pas une seconde définition du type. Le motif se compile depuis le gabarit de ligne (motif.py:143), et aucune clé n'accepte une regex écrite."

[[conformite.signal]]
id = "S3"
signal = "L'espace admise dans les `values` d'un champ, au-delà des captures."
etat = "absent"
constat = "Rejoué : un champ `enum` aux `values = [\"x\", \" \"]` est toujours refusé (« une valeur ne peut être vide ni contenir d'espace »). `parse_field` n'est pas touchée : seule `parse_capture` admet l'espace."

[[conformite.signal]]
id = "S4"
signal = "Un test existant modifié pour passer."
etat = "absent"
constat = "Aucun fichier de test antérieur au Chantier n'est modifié : tous les fichiers de test sont en A (vérification C7). E12, E13 et E16 modifient des tests du Chantier lui-même (test_pose_structure.py, test_prefix.py, test_motif_contrat.py) pour suivre des décisions inscrites au Journal. S4 vise les tests existants, ces tests-là n'en sont pas."

[[conformite.signal]]
id = "S5"
signal = "Le diff touche `~/.config/nvim/`, ou introduit `table`, `object` ou Pydantic."
etat = "absent"
constat = "`git -C ~/.config/nvim status --short` est vide, comme au début du Chantier. Dans le diff, `grep -nE '^\\+.*(pydantic|Pydantic|\"table\"|\"object\")'` ne trouve que la prose du Brief, du Suivi et du Plan qui énonce S5 elle-même. Aucun code ne les introduit."

[conformite.symptome]
symptome = "le format de certaines sections (`Étapes`, `Dettes écartées`, critères du Brief, `État courant`, `Objectif et périmètre`, `Passation`) n'est déclaré qu'en prose, dans la `description` du Contrat, et parsé par des regex écrites hors de gabarit. Le format existe deux fois, et `gabarit check` ne voit pas une ligne mal formée : l'erreur n'apparaît qu'à `audit pose`, ou jamais quand la ligne est ignorée."
etat = "persiste"
dette = "R1"
constat = "Comme à l'audit 01 : le mécanisme est livré (C1 à C6 atteints), mais aucune Semence livrée ne déclare de `type`. Les sections nommées par le symptôme restent en prose, et une ligne d'Étape mal formée du Suivi passe toujours `gabarit check`. Le Hors-périmètre renvoie cette adoption au Chantier suivant, c'est donc voulu. La bonne solution est bâtie, pour le bon problème : le motif de test (`[{etat: enum}] {n: int}. …`) est celui des Étapes."

[[dette.precedente]]
id = "R1"
nature = "alignement"
emplacement = "Brief, symptôme ; skills/gabarit/gabarit/brief/contract.toml, skills/gabarit/gabarit/suivi/contract.toml"
constat = "Le symptôme d'origine persiste sur les sections qu'il nomme (`Étapes`, `Dettes écartées`, critères du Brief, `État courant`, `Objectif et périmètre`, `Passation`). Aucune Semence livrée ne déclare de `type`, et une ligne d'Étape mal formée passe encore `gabarit check`. C'est voulu : le Hors-périmètre renvoie l'adoption au Chantier suivant. Ce Chantier ne livre que le mécanisme."
trouvee = "01-bdf5e5b"
solution = "Solder au Chantier d'intégration : déclarer `type = \"motif\"` ou `\"label\"` sur ces sections des Semences `brief` et `suivi`, puis vérifier qu'une ligne d'Étape mal formée fait échouer `gabarit check`."
severite = "note"

[[dette.precedente]]
id = "R2"
nature = "qualité"
emplacement = "skills/gabarit/scripts/gabarit/prefill.py:202-236, skills/gabarit/scripts/gabarit/structure.py:362-378, skills/list-dir/scripts/listdir/store.py:797-803"
constat = "Un squelette de labels resté tel que `new` l'a posé n'est jamais reconnu comme laissé au Marqueur. D'où deux effets. (1) Une section ou un label `type = \"label\"` FACULTATIF qui porte un label requis rend `check --filled` en échec sur un fichier qu'on vient de poser. Rejoué : Semence `Annexe` facultative, son label `Source` requis ; `new`, la seule section requise remplie, puis `check --filled` → « section « Annexe », label « Source » — à remplir », code 1. On ne s'en sort qu'en supprimant la section. Cela contredit la règle « les facultatifs ne sont jamais réclamés » (format.md, Les deux verdicts), que le Journal applique déjà au `prefix` (2026-10-16 : une table facultative ne réclame rien). (2) `merge` n'omet que le corps entier au Marqueur. Un squelette dont les labels sont restés à `<OPTIONNEL>` passe donc tel quel dans l'aggloméré, alors que la règle de list-dir veut l'omettre. Aucun test ne couvre ces deux cas."
trouvee = "01-bdf5e5b"
solution = "Ne pas juger la structure d'une table facultative tant que tous ses labels sont restés au Marqueur, comme pour le `prefix` ; dans `merge`, omettre de même un squelette resté entier au Marqueur. Ajouter les deux tests ; corriger le tableau de « Les marqueurs » de format.md, qui dit aujourd'hui « chaque label requis resté au marqueur » sans condition."
severite = "avertissement"

[[dette.precedente]]
id = "R3"
nature = "dette induite"
emplacement = "skills/list-dir/scripts/listdir/store.py:809"
constat = "`merge` rend chaque section sous `### <titre>`. Les labels `title` d'une section, écrits en `###`, y deviennent des titres de même rang que leur section, et la hiérarchie de l'aggloméré se perd sans rien signaler. Le Plan l'a reconnu comme « Limite admise », « proposé en dette à la Clôture ». Rien ne l'a encore porté au Registre, et la prose de list-dir n'en dit rien. Le coût vient avec la première List-dir dont un Contrat déclare une section `forme = \"title\"`."
trouvee = "01-bdf5e5b"
solution = "Porter au Registre de dette, ou décaler dans `merge` les titres d'une section `title` d'un rang (hors blocs de code, comme le recomptage), avec un test. Au minimum, nommer la limite dans skills/list-dir/references/format.md."
severite = "avertissement"

[[dette.precedente]]
id = "R4"
nature = "dette induite"
emplacement = "skills/gabarit/scripts/gabarit/structure.py:36, :41 ; skills/gabarit/scripts/gabarit/prefill.py:38 ; skills/gabarit/scripts/gabarit/contract.py:322"
constat = "Deux constantes ont plus d'une définition. L'entier lexical existait en `prefill.ENTIER`, avec sa docstring qui justifie `[0-9]` contre `\\d` ; `structure._ENTIER` le recopie sans elle. Le rang des labels d'une section s'écrit `RANG_SECTION + 1` dans structure.py et prefill.py, mais `rang=3` en dur dans contract.py. La cause est l'ordre des imports : prefill importe structure, et structure importe contract. Un changement de l'une de ces règles devra se faire en deux ou trois endroits, sans que rien ne le rappelle."
trouvee = "01-bdf5e5b"
solution = "Ranger `ENTIER` et `RANG_SECTION` dans `types.py`, à côté de `RANG_MAX`, et les importer dans prefill.py, structure.py et contract.py."
severite = "note"

[[dette.precedente]]
id = "R5"
nature = "style"
emplacement = ".claude/implementation/gabarit-sections-structurees.md:41-43, `## Objectif et périmètre`"
constat = "La section `## Objectif et périmètre` du Suivi a reçu l'élargissement `fin = \"\\n\"`. En revanche, elle garde le texte de C3 tel que le Brief l'a figé (« une capture n'a pas de `captures.x` ou de `description` »), alors que le Journal (2026-10-16) rend ces deux exigences facultatives et réduit les captures à cinq types. Qui lit l'objectif sans le Journal juge sur une exigence abandonnée."
trouvee = "01-bdf5e5b"
solution = "Ajouter à `## Objectif et périmètre` une ligne datée qui amende C3, comme celle de l'élargissement du 2026-10-17."
severite = "note"

