constat = "Un squelette de labels resté tel que `new` l'a posé n'est jamais reconnu comme laissé au Marqueur. D'où deux effets. (1) Une section ou un label `type = \"label\"` FACULTATIF qui porte un label requis rend `check --filled` en échec sur un fichier qu'on vient de poser. Rejoué : Semence `Annexe` facultative, son label `Source` requis ; `new`, la seule section requise remplie, puis `check --filled` → « section « Annexe », label « Source » — à remplir », code 1. On ne s'en sort qu'en supprimant la section. Cela contredit la règle « les facultatifs ne sont jamais réclamés » (format.md, Les deux verdicts), que le Journal applique déjà au `prefix` (2026-10-16 : une table facultative ne réclame rien). (2) `merge` n'omet que le corps entier au Marqueur. Un squelette dont les labels sont restés à `<OPTIONNEL>` passe donc tel quel dans l'aggloméré, alors que la règle de list-dir veut l'omettre. Aucun test ne couvre ces deux cas."
