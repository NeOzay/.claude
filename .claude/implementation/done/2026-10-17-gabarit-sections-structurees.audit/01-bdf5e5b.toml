solution = "Ne pas juger la structure d'une table facultative tant que tous ses labels sont restés au Marqueur, comme pour le `prefix` ; dans `merge`, omettre de même un squelette resté entier au Marqueur. Ajouter les deux tests ; corriger le tableau de « Les marqueurs » de format.md, qui dit aujourd'hui « chaque label requis resté au marqueur » sans condition."
