[[conformite.critere]]
id = "C1"
critere = "Sur une section `type = \"motif\"`, `gabarit check` passe un fichier conforme et nomme section, puce et capture pour chaque faute : `fin` manquante, texte hors puce, puce imbriquée, valeur hors `values`, `int` hors min-max, `sequence` rompue ou mal partie. Une puce multiligne ou un « ; » intérieur ne fautent pas."
etat = "atteint"
constat = "Vérification Étape 4 (test_motif.py, 19 passés : conforme multiligne et « ; »/« ;; » intérieurs, fin manquante, texte hors puce, puce imbriquée, hors values, int mal écrit et hors min-max, sequence rompue et mal partie, CLI). Rejoué en ligne de commande sur une Semence d'essai du scratchpad : `gabarit check` passe un fichier à puces multilignes, « ; » et « ;; » intérieurs et `[ ]` (code 0) et, sur le fichier fautif, nomme chaque faute au format « section « Étapes », puce N, capture « c » — raison » : texte hors puce, « ;; » manquant avant la puce suivante (puce imbriquée), « ;; » final manquant, « ? » hors des valeurs, 9 dépasse le maximum 4, séquence mal partie (2 pour 1) et rompue. Code lu : structure.py:79-257. L'élargissement daté du Suivi (`fin = \"\\n\"`, où « fin manquante » ne vaut pas) est couvert par test_fin_de_ligne.py (13 passés)."

[[conformite.critere]]
id = "C2"
critere = "Sur une section `type = \"label\"`, en `bold` comme en `title` (rangs 3 à 6, imbrication, motif dans un label), `check` nomme : label `required` absent, `order` violé, prose avant le premier sans `prefix`, labels non séparés d'une ligne vide, étiquette non déclarée (en note)."
etat = "atteint"
constat = "Vérifications Étapes 5 et 11 (test_label.py, 22 passés ; test_prefix.py, 9 passés) : chaque point en bold et en title, imbrication title→title→bold, motif dans un label, note d'étiquette non déclarée sur le canal des notes à verdict inchangé. Rejoué en ligne de commande sur une Semence d'essai (title → bold → motif) : label requis « manquant » à chaque niveau, « order » 1 placé après « Détail » (2), prose avant le premier label sans prefix, « non séparé de ce qui précède par une ligne vide » en bold et en title, fautes du motif d'un label préfixées du chemin, et « étiquette non déclarée au contrat » sortie sur stderr après le décompte, sans compter parmi les manquements. Code lu : structure.py:261-402."

[[conformite.critere]]
id = "C3"
critere = "Le chargement refuse, en nommant le chemin, un Contrat dont une capture n'a pas de `captures.x` ou de `description`, une `enum` sans `values`, un type de capture inconnu, un `title` dans un `bold`, deux formes à un niveau, un rang au-delà de 6."
etat = "atteint"
constat = "Tel que le Suivi l'amende : le Journal de décisions (2026-10-16, ratifié) rend facultatives la table `captures.<nom>` et sa `description`, et limite les captures à cinq types. Une capture sans table ni description prend celle de sa section (test_motif_contrat.py:110 et :130). Le reste de C3 est rejoué par `gabarit contract --from` sur des Contrats d'essai, chaque refus nommant le chemin : « section « S », capture « e » — un enum sans `values` n'admet rien », type « bool » inconnu, « label « A » — « forme » réservé à une section de `type = \"label\"` » (deux formes à un niveau), « un label « bold » ne porte pas de labels » (title dans bold), « … label « D » — des labels « title » y seraient de rang 7, au-delà de 6 », rang 6 admis. Vérifications Étapes 1, 2 et 13 : passées. Le texte de C3 au Suivi n'a pas suivi l'amendement : R5."

[[conformite.critere]]
id = "C4"
critere = "`gabarit new` pose une section structurée au Marqueur portant son type et son motif ; `gabarit check --filled` la signale à remplir."
etat = "atteint"
constat = "Rejoué : `gabarit new --from` sur une Semence d'essai pose `<À REMPLIR motif: - [{etat: enum}] {n: int}. {intitule} — vérif: {verif};;>`, et sous un label bold `<OPTIONNEL motif: - {a: int} {b};;>` à la ligne ; `check` rend « conforme » (code 0), `check --filled` « section « Étapes » — à remplir » (code 1). Vérifications Étapes 3, 6, 12 et 14 passées (test_marqueur_structure.py, test_pose_structure.py, dont le Marqueur réenroulé sur deux lignes reconnu). Code lu : types.py:237-253, prefill.py:194-236, check.py:134-152. Effet de bord relevé sur le squelette d'une table facultative : R2."

