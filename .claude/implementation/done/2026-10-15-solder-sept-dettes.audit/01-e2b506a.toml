justification = """Deux dettes `bloquant` d'office, R2 et R3, viennent de deux vérifications échouées du critère C4 du Suivi. `uvx rumdl fmt --check .` est rouge sur la branche, à cause du Suivi et du Plan, qui ne sont pas formatés. `basedpyright` compte 82 erreurs contre 81 sur la Base. Leur gravité réelle est faible et chacune se solde en une commande ou une ligne, ou s'écarte par l'utilisateur en `## Dettes écartées`. Le verdict suit la règle, pas cette gravité.

Le fond est conforme à l'intention. Les sept dettes sont traitées comme l'entrée de road-map l'a décidé. Les tests neufs nommés par le Suivi existent, passent, et échouent sur le code de la Base (rejoué sur `git archive master`). Le scénario du HOME git, rejoué par la ligne de commande, passe de « liste rc=0, chemin rc=1 » à « liste rc=1, chemin rc=0 ». Le lien vers `claude-code-mods` est rétabli. Les quatre suites, `check_pipeline.py`, `claude plugin test` et `ruff` sur les fichiers touchés sont verts. Le `ruff .` du dépôt entier porte deux E501 qui existaient déjà dans `test_fusion.py`, identiques sur la Base et inscrites au Registre.

Aucun Signal de dérive du Suivi ne s'est matérialisé. `register.ts` ne change que dans le commentaire. La documentation de la dette 1 est dans `.claude/CLAUDE.md`, et `forme_texte` est intacte. Aucune dette hors des sept n'est touchée : l'entrée de road-map `lexique-relu-a-chaque-composition` est une décision du journal. Les exclusions sont respectées.

R1 (avertissement) est la réserve de fond. `libelle` laisse passer un `\\n` final et perd le contenu d'une valeur qui commence par une ligne vide, si bien que la dette `migrate-valeur-multilignes-…` serait soldée avec un cas résiduel plausible. R4 (note) est un `chdir` hérité par les tests CLI.

Le critère C1, le passage des dettes en `technical-debt-solde/`, relève de la Clôture et n'est pas jugé ici."""
