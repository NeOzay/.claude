constat = """`semer`, déplacé dans `jouet.py`, garde son `os.chdir(tmp_path)` sans jamais le rétablir. C'est voulu pour les tests de bibliothèque, et le Plan l'a décidé. Les quatre nouveaux tests CLI de `reseed` qui l'appellent n'en ont pas besoin, puisqu'ils passent `cwd=tmp_path` à `lancer`. Ils changent pourtant le répertoire courant du processus pytest pour tous les tests qui suivent dans la session. La fuite existait dans `test_reseed.py`. Le Chantier l'étend à `test_entree_cli.py` et en fait un comportement de `jouet`, le module partagé. Le coût futur : un test ajouté après ces quatre, et qui dépend d'un chemin relatif, verrait son résultat dépendre de l'ordre de collecte. Aujourd'hui, la suite est verte (534 passed)."""
