emplacement = "skills/list-dir/scripts/listdir/store.py:878-889"
constat = "`libelle` ne tient pas toujours sa promesse « UN CHANGEMENT, UNE LIGNE ». Une valeur qui n'a qu'une ligne de contenu mais finit par un saut de ligne passe la garde `len(lignes) <= 1` et est rendue entière, `\\n` compris. Une valeur qui commence par une ligne vide est citée « … », sans rien de son contenu. Rejoué sur `migrate` avec un montage de `test_store_ecriture.py` : la section préremplie par `text = \"\"\"\\nSection posée.\\n\"\"\"`, l'idiome TOML d'une chaîne multi-lignes, rend « … — ajoutée, Section posée.\\n ». La sortie jointe porte donc une ligne vide. `text = \"\\nSuite.\"` rend « ajoutée,  … ». Aucun contrat versionné n'écrit cette forme aujourd'hui (`git ls-files '*.toml' | xargs grep 'text = \"\"\"'` ne rend rien). Mais la dette `migrate-valeur-multilignes-casse-une-ligne-par-changement` serait soldée en laissant ouvert un cas plausible, et l'échec ne se voit pas. Les tests de l'Étape 4 ne couvrent ni l'une ni l'autre de ces entrées."
trouvee = "01-e2b506a"
solution = "Faire travailler `libelle` sur le texte sans ses blancs de bord, `forme_texte(valeur).strip().splitlines()`, et rendre la première ligne non vide suivie de « … » dès qu'il en reste plusieurs. Ajouter à `test_store_ecriture.py` une section `text = \"\"\"\\n…\\n\"\"\"` et une valeur qui commence par une ligne vide, et vérifier qu'aucun libellé ne contient de `\\n`."
severite = "avertissement"

