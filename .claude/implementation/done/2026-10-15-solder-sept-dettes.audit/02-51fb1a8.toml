constat = "Le Suivi et le Plan ont été commités sans `uvx rumdl fmt`, alors qu'`OUTILLAGE.md` le demande avant de commiter du Markdown. Sur le commit audité, `uvx rumdl fmt --check .`, la commande de la « Vérification de fin » du Plan, sort en 1 : « Would fix: 11/39 issues in 2 files ». Ce sont ces deux fichiers seulement, en MD013 : les lignes d'Étape du Suivi font jusqu'à 356 colonnes, et le Plan a 10 lignes de plus de 100 colonnes. Sur la Base extraite (`git archive master`), la même commande sort en 0. Le critère C4 du Suivi, « rumdl vert », est donc faux sur la branche, et sa vérification `échouée` cote cette dette `bloquant` d'office. Sa gravité réelle est faible : une commande suffit à le corriger, et le défaut disparaît à l'aplatissement, puisque Suivi et Plan partent en `done/`, que `.rumdl.toml` exclut. Le précédent `done/2026-10-14-list-dir-fill-override.md` a ses Étapes enroulées, et `pose.py` les relit en joignant les lignes."
