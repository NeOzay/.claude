trouvee = "01-e2b506a"
solution = "Lancer `uvx rumdl fmt .claude/implementation/solder-sept-dettes.md .claude/plans/robust-soaring-hejlsberg.md` avant la Clôture, puis vérifier que `uvx rumdl fmt --check .` sort en 0."
severite = "bloquant"

[[dette.precedente]]
id = "R3"
nature = "alignement"
emplacement = "skills/shadow-skill/scripts/tests/test_lire.py:92"
constat = "Le Suivi pose comme critère que `basedpyright` ne régresse pas par rapport à la Base. Le décompte monte d'une erreur. `uvx --with pytest basedpyright scripts skills/shadow-skill skills/lexique skills/list-dir` rend 82 erreurs sur la branche et 81 sur la Base extraite. Comparées fichier par fichier, les deux sorties JSON ne diffèrent que sur `test_lire.py`, avec 16 erreurs contre 17. L'erreur de plus est « Type of parameter \"poser\" is unknown » sur le test neuf `test_chercher_en_debut_de_mot`. Sa cause existe déjà : `from conftest import Poser` ne se résout pas, et chacun des 12 tests existants qui prennent `poser` porte la même erreur. Il n'y a aucune cause nouvelle, mais le critère n'est pas tenu. Sa vérification `échouée` cote cette dette `bloquant` d'office, alors que sa gravité réelle est faible. La comparaison du dépôt entier (6588 contre 570) n'est pas significative : `skills/synced/`, non versionné, et l'environnement de résolution de l'arbre extrait la faussent."
trouvee = "01-e2b506a"
solution = "Au choix de l'utilisateur. Une option est de faire tenir le critère sans sortir du Chantier : poser sur le paramètre `poser` du test neuf un `# pyright: ignore[reportUnknownParameterType]` qui renvoie à la cause, comme `rules/claude-python-style.md` l'admet. L'autre est de faire résoudre `Poser` dans `skills/shadow-skill/scripts/tests/`, ce qui retire les 17 erreurs. C'est hors des sept dettes, donc plutôt à inscrire au Registre. L'utilisateur peut aussi accepter le +1 et l'écrire en `## Dettes écartées` du Suivi."
severite = "bloquant"

